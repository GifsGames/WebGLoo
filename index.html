<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>RadioLegendsHQ - Bairro Vivo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="hud">🎮 RadioLegendsHQ - Beta\nUse WASD para mover o rapaz, setas para mover a moça!</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    const loader = new THREE.TextureLoader();

    // Funções auxiliares
    function createLamp(x, z) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshStandardMaterial({ color: 0x888888 }));
      pole.position.set(x, 2, z);
      scene.add(pole);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa }));
      lamp.position.set(x, 4, z);
      scene.add(lamp);
    }

    function createTree(x, z) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshStandardMaterial({ color: 0x663300 }));
      trunk.position.set(x, 0.5, z);
      scene.add(trunk);
      const crown = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0x228B22 }));
      crown.position.set(x, 1.5, z);
      scene.add(crown);
    }

    function createArea(offsetX) {
      // Rua
      const street = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 20),
        new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
      );
      street.rotation.x = Math.PI / 2;
      street.position.set(offsetX, 0, 0);
      scene.add(street);

      // Padaria
      const bakery = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshStandardMaterial({ color: 0xffcc66 }));
      bakery.position.set(offsetX - 5, 1.5, -12);
      scene.add(bakery);

      // Borracharia
      const tireShop = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshStandardMaterial({ color: 0x999999 }));
      tireShop.position.set(offsetX + 5, 1.5, -13);
      scene.add(tireShop);

      // Árvores e postes
      createTree(offsetX - 10, -6);
      createTree(offsetX + 10, -6);
      createLamp(offsetX - 8, -2);
      createLamp(offsetX + 8, 2);
    }

    // Criar duas áreas
    createArea(0);   // Área esquerda
    createArea(45);  // Área direita

    // Ponte
    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.5, 4),
      new THREE.MeshStandardMaterial({ color: 0x8B4513 })
    );
    bridge.position.set(22, 0.25, -10);
    scene.add(bridge);

    // Carros
    function createCar(textureURL, x, z, speed) {
      const carTexture = loader.load(textureURL);
      const car = new THREE.Mesh(
        new THREE.BoxGeometry(4, 2, 0.1),
        new THREE.MeshStandardMaterial({ map: carTexture })
      );
      car.position.set(x, 0.4, z);
      car.userData.speed = speed;
      scene.add(car);
      return car;
    }
    const car1 = createCar("https://i.imgur.com/ZffpE3q.png", -5, 2, 0.02);
    const car2 = createCar("https://i.imgur.com/cmhonW3.png", 5, -2, -0.015);
    const car3 = createCar("https://i.imgur.com/ZffpE3q.png", -2, -4, 0.01);

    // Personagens
    const boyFace = loader.load("https://i.imgur.com/C2QhuQh.png");
    const boy = new THREE.Sprite(new THREE.SpriteMaterial({ map: boyFace }));
    boy.scale.set(1.5, 1.5, 1);
    boy.position.set(-6, 0.6, 0);
    scene.add(boy);

    const girlFace = loader.load("https://i.imgur.com/6WmxRxk.png");
    const girl = new THREE.Sprite(new THREE.SpriteMaterial({ map: girlFace }));
    girl.scale.set(1.5, 1.5, 1);
    girl.position.set(6, 0.6, 0);
    scene.add(girl);

    camera.position.set(0, 8, 20);
    camera.lookAt(0, 0, 0);

    let hudText = "🎮 RadioLegendsHQ - Beta\nUse WASD para mover o rapaz, setas para mover a moça!";
    document.getElementById("hud").innerText = hudText;

    // Controles
    window.addEventListener("keydown", (event) => {
      if(event.key === "w") boy.position.z -= 0.2;
      if(event.key === "s") boy.position.z += 0.2;
      if(event.key === "a") boy.position.x -= 0.2;
      if(event.key === "d") boy.position.x += 0.2;

      if(event.key === "ArrowUp") girl.position.z -= 0.2;
      if(event.key === "ArrowDown") girl.position.z += 0.2;
      if(event.key === "ArrowLeft") girl.position.x -= 0.2;
      if(event.key === "ArrowRight") girl.position.x += 0.2;
    });

    // Loop de animação
    function animate() {
      requestAnimationFrame(animate);

      [car1, car2, car3].forEach(car => {
        car.position.x += car.userData.speed;
        if (car.position.x > 6) car.position.x = -6;
        if (car.position.x < -6) car.position.x = 6;
      });

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
