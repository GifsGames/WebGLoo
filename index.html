<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WebGloo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      white-space: pre-line;
    }
    /* Tela de entrada estilo cinema */
    #intro {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Black', sans-serif;
      font-size: 2em;
      z-index: 10;
      animation: fadeOut 4s forwards;
      animation-delay: 3s;
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    /* Tela de saída estilo créditos */
    #outro {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Black', sans-serif;
      font-size: 2em;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="intro">🎬 Bem-vindo ao WebGloo<br>Prepare-se para a aventura!</div>
  <div id="hud">🎮 WebGloo 
Use WASD para mover o rapaz, setas para mover a moça!</div>
  <div id="outro">🎬 Fim da Jornada<br>Obrigado por jogar!</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    const loader = new THREE.TextureLoader();

    // Rua principal
    const street = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide }));
    street.rotation.x = -Math.PI / 2;
    scene.add(street);

    // Ponte
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
    bridge.position.set(0, 0, 0);
    scene.add(bridge);

    // Prefeitura ao lado da padaria
    const prefeitura = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 5), new THREE.MeshStandardMaterial({ color: 0x336699 }));
    prefeitura.position.set(12, 2, -12);
    scene.add(prefeitura);

    const fachadaPrefeitura = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), new THREE.MeshStandardMaterial({ map: loader.load("./assets/prefeitura.png") }));
    fachadaPrefeitura.position.set(12, 2, -10.2);
    scene.add(fachadaPrefeitura);

    // Banco em frente à prefeitura
    const bancoPrefeitura = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 1.2), new THREE.MeshStandardMaterial({ color: 0x996633 }));
    bancoPrefeitura.position.set(12, 0.25, -8);
    scene.add(bancoPrefeitura);

    // HUD
    let hudText = "🎮 WebGloo \nUse WASD para mover o rapaz, setas para mover a moça!";
    document.getElementById("hud").innerText = hudText;

    // Loop de animação
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Controles do rapaz (WASD) e da moça (setas)
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "w") camera.position.z -= 0.2;
      if (key === "s") camera.position.z += 0.2;
      if (key === "a") camera.position.x -= 0.2;
      if (key === "d") camera.position.x += 0.2;

      if (event.key === "Escape") {
        document.getElementById("outro").style.display = "flex";
      }
    });
  </script>
</body>
</html>
