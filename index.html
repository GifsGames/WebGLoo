<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WebGloo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="hud">🎮 WebGloo 
Use WASD para mover o rapaz, setas para mover a moça!</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    const loader = new THREE.TextureLoader();

    // Rua principal
    const street = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide }));
    street.rotation.x = -Math.PI / 2;
    scene.add(street);

    // Banco
    const bench = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 1.2), new THREE.MeshStandardMaterial({ color: 0x996633 }));
    bench.position.set(0, 0.25, -9);
    scene.add(bench);

    // Carros
    function createCar(textureURL, x, z) {
      const carTexture = loader.load(textureURL);
      const car = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.1), new THREE.MeshStandardMaterial({ map: carTexture }));
      car.position.set(x, 0.4, z);
      scene.add(car);
      return car;
    }
    const car1 = createCar("./assets/car1.png", -5, 2);
    const car2 = createCar("./assets/car2.png", 5, -2);
    const car3 = createCar("./assets/car1.png", -2, -4);

    // Rapaz e Moça
    const boy = new THREE.Sprite(new THREE.SpriteMaterial({ map: loader.load("./assets/boy.png") }));
    boy.scale.set(1.5, 1.5, 1);
    boy.position.set(-6, 0.6, 0);
    scene.add(boy);

    const girl = new THREE.Sprite(new THREE.SpriteMaterial({ map: loader.load("./assets/girl.png") }));
    girl.scale.set(1.5, 1.5, 1);
    girl.position.set(6, 0.6, 0);
    scene.add(girl);

    // Padaria e Borracharia
    const bakery = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshStandardMaterial({ color: 0xffcc66 }));
    bakery.position.set(0, 1.5, -12.0);
    scene.add(bakery);
    const fachada = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshStandardMaterial({ map: loader.load("./assets/bakery.png") }));
    fachada.position.set(0, 1.5, -10);
    scene.add(fachada);

    const tireShop = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshStandardMaterial({ color: 0x999999 }));
    tireShop.position.set(6, 1.5, -13.0);
    scene.add(tireShop);
    const fachadaBorracharia = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshStandardMaterial({ map: loader.load("./assets/tire.png") }));
    fachadaBorracharia.position.set(6, 1.5, -10.2);
    scene.add(fachadaBorracharia);

    // Clientes
    const cust1 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffff00 }));
    cust1.position.set(-5, 0.2, -12);
    scene.add(cust1);
    const cust2 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshStandardMaterial({ color: 0x00ff00 }));
    cust2.position.set(5, 0.2, -12);
    scene.add(cust2);

    const clienteHead = new THREE.Sprite(new THREE.SpriteMaterial({ map: loader.load("./assets/customer.png") }));
    clienteHead.scale.set(1, 1, 1);
    scene.add(clienteHead);

    // Ponte
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
    bridge.position.set(25, 0, 0);
    scene.add(bridge);

    // Prefeitura ao lado da padaria
    const prefeitura = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 5), new THREE.MeshStandardMaterial({ color: 0x336699 }));
    prefeitura.position.set(0, 2, -24); // deslocada para a direita
    scene.add(prefeitura);

    const fachadaPrefeitura = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), new THREE.MeshStandardMaterial({ map: loader.load("./assets/prefeitura.png") }));
    fachadaPrefeitura.position.set(12, 2, -10.2);
    scene.add(fachadaPrefeitura);

    // Banco em frente à prefeitura
    const bancoPrefeitura = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 1.2), new THREE.MeshStandardMaterial({ color: 0x996633 }));
    bancoPrefeitura.position.set(12, 0.25, -8);
    scene.add(bancoPrefeitura);

    // HUD
    let hudText = "🎮 WebGloo \nUse WASD para mover o rapaz, setas para mover a moça!";
    document.getElementById("hud").innerText = hudText;

    // Movimento dos clientes
    function moveCustomers() {
      cust1.position.z += 0.02;
      if (cust1.position.z > -8) cust1.position.z = -12;
      cust2.position.z += 0.015;
      if (cust2.position.z > -8) cust2.position.z = -12;
      clienteHead.position.set(cust1.position.x, cust1.position.y + 0.5, cust1.position.z);
      clienteHead.rotation.z += 0.05;
    }

    // Conversas
    function checkConversation() {
      const distBoy = Math.hypot(boy.position.x - bench.position.x, boy.position.z - bench.position.z);
      const distGirl = Math.hypot(girl.position.x - bench.position.x, girl.position.z - bench.position.z);
      if (distBoy < 1 && distGirl < 1) {
        hudText = "🧑🏻 Rapaz: Esse banco é perfeito pra conversar!\n👩🏻 Moça: Sim, vamos até a prefeitura!";
        document.getElementById("hud").innerText = hudText;
      }
    }

    function checkPrefeituraConversation() {
      const distBoy = Math.hypot(boy.position.x - bancoPrefeitura.position.x, boy.position.z - bancoPrefeitura.position.z);
      const distGirl = Math.hypot(girl.position.x - bancoPrefeitura.position.x, girl.position.z - bancoPrefeitura.position.z);
      if (distBoy < 1 && distGirl < 1) {
        hudText = "🧑🏻 Rapaz: A prefeitura precisa cuidar melhor da praça!\n👩🏻 Moça: Sim, vamos falar com o prefeito!\n🏛️ Prefeitura: O coração da cidade está aqui!";
        document.getElementById("hud").innerText = hudText;
      }
    }

          // Atualizar loop de animação
    function animate() {
      requestAnimationFrame(animate);

      car1.position.x += 0.02;
      if (car1.position.x > 20) car1.position.x = -20;

      car2.position.x -= 0.015;
      if (car2.position.x < -6) car2.position.x = 6;

      car3.position.x += 0.01;
      if (car3.position.x > 6) car3.position.x = -6;

      moveCustomers();
      checkConversation();
      checkPrefeituraConversation();

      renderer.render(scene, camera);
    }
    animate();

    // Controles do rapaz (WASD) e da moça (setas)
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (key === "w") boy.position.z += 0.2;
      if (key === "s") boy.position.z -= 0.2;
      if (key === "a") boy.position.x -= 0.2;
      if (key === "d") boy.position.x += 0.2;

      if (event.key === "ArrowUp") girl.position.z += 0.2;
      if (event.key === "ArrowDown") girl.position.z -= 0.2;
      if (event.key === "ArrowLeft") girl.position.x -= 0.2;
      if (event.key === "ArrowRight") girl.position.x += 0.2;
    });
  </script>
</body>
</html>
