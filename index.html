<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WebGloo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="hud">🎮 WebGloo \nUse WASD para mover o rapaz, setas para mover a moça!</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Rua
    const street = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 20),
      new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    street.rotation.x = Math.PI / 2;
    scene.add(street);

    // Banco
    const bench = new THREE.Mesh(
      new THREE.BoxGeometry(4, 0.5, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x996633 })
    );
    bench.position.set(0, 0.25, -9);
    scene.add(bench);

    // Carros
    function createCar(textureURL, x, z) {
      const loader = new THREE.TextureLoader();
      const carTexture = loader.load(textureURL);
      const car = new THREE.Mesh(
        new THREE.BoxGeometry(4, 2, 0.1),
        new THREE.MeshStandardMaterial({ map: carTexture })
      );
      car.position.set(x, 0.4, z);
      scene.add(car);
      return car;
    }
    const car1 = createCar("https://i.imgur.com/ZffpE3q.png", -5, 2);
    const car2 = createCar("https://i.imgur.com/cmhonW3.png", 5, -2);
    const car3 = createCar("https://i.imgur.com/ZffpE3q.png", -2, -4);

    const loader = new THREE.TextureLoader();

    // Rapaz
    const boyFace = loader.load("https://i.imgur.com/C2QhuQh.png");
    const boy = new THREE.Sprite(new THREE.SpriteMaterial({ map: boyFace }));
    boy.scale.set(1.5, 1.5, 1);
    boy.position.set(-6, 0.6, 0);
    scene.add(boy);

    // Moça
    const girlFace = loader.load("https://i.imgur.com/6WmxRxk.png");
    const girl = new THREE.Sprite(new THREE.SpriteMaterial({ map: girlFace }));
    girl.scale.set(1.5, 1.5, 1);
    girl.position.set(6, 0.6, 0);
    scene.add(girl);

    // Padaria
    const bakery = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshStandardMaterial({ color: 0xffcc66 }));
    bakery.position.set(0, 1.5, -12.0);
    scene.add(bakery);

    const fachadaTexture = loader.load("https://i.imgur.com/ywvsTHj.png");
    const fachada = new THREE.Mesh(
      new THREE.PlaneGeometry(6, 3),
      new THREE.MeshStandardMaterial({ map: fachadaTexture })
    );
    fachada.position.set(0, 1.5, -10);
    scene.add(fachada);

    // Borracharia
    const tireShop = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshStandardMaterial({ color: 0x999999 }));
    tireShop.position.set(6, 1.5, -13.0);
    scene.add(tireShop);

    const fachadaBorrachariaTexture = loader.load("https://i.imgur.com/ZQMzpcJ.png");
    const fachadaBorracharia = new THREE.Mesh(
      new THREE.PlaneGeometry(6, 3),
      new THREE.MeshStandardMaterial({ map: fachadaBorrachariaTexture })
    );
    fachadaBorracharia.position.set(6, 1.5, -10.2);
    scene.add(fachadaBorracharia);

    // Clientes
    function createCustomer(x, z, color) {
      const cust = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshStandardMaterial({ color }));
      cust.position.set(x, 0.2, z);
      scene.add(cust);
      return cust;
    }
    const cust1 = createCustomer(-5, -12, 0xffff00);
    const cust2 = createCustomer(5, -12, 0x00ff00);

    // Postes
    function createLamp(x, z) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshStandardMaterial({ color: 0x888888 }));
      pole.position.set(x, 2, z);
      scene.add(pole);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa }));
      lamp.position.set(x, 4, z);
      scene.add(lamp);
    }
    createLamp(-8, -2);
    createLamp(8, 2);

    // Árvores
    function createTree(x, z) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshStandardMaterial({ color: 0x663300 }));
      trunk.position.set(x, 0.5, z);
      scene.add(trunk);
      const crown = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0x228B22 }));
      crown.position.set(x, 1.5, z);
      scene.add(crown);
    }
    createTree(-10, -6);
    createTree(10, -6);

    camera.position.set(0, 8, 16);
    camera.lookAt(0, 0, 0);

    let hudText = "🎮 WebGloo \nUse WASD para mover o rapaz, setas para mover a moça!";
    document.getElementById("hud").innerText = hudText;

    // Movimento dos clientes
    function moveCustomers() {
      cust1.position.z += 0.02;
      if (cust1.position.z > -8) cust1.position.z = -12;
      cust2.position.z += 0.015;
      if (cust2.position.z > -8) cust2.position.z = -12;
    }

    // Conversa no banco
    function checkConversation() {
      const distBoy = Math.sqrt((boy.position.x - bench.position.x)**2 + (boy.position.z - bench.position.z)**2);
      const distGirl = Math.sqrt((girl.position.x - bench.position.x)**2 + (girl.position.z - bench.position.z)**2);
      if (distBoy < 1 && distGirl < 1) {
        hudText = "🧑🏻 Rapaz: Que bom te ver!\n👩🏻 Moça: Vamos sentar juntos no banco!\n 👨🏼A padaria está cheia de gente!\n🛞 Ao lado: A borracharia está aberta!";
        document.getElementById("hud").innerText = hudText;
      }
    }

        // --- Segunda região ---
    const street2 = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 20),
      new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    street2.rotation.x = Math.PI / 2;
    street2.position.set(50, 0, 0);
    scene.add(street2);

    const bakery2 = new THREE.Mesh(
      new THREE.BoxGeometry(6, 3, 4),
      new THREE.MeshStandardMaterial({ color: 0xffcc66 })
    );
    bakery2.position.set(45, 1.5, -12);
    scene.add(bakery2);

    const tireShop2 = new THREE.Mesh(
      new THREE.BoxGeometry(6, 3, 4),
      new THREE.MeshStandardMaterial({ color: 0x999999 })
    );
    tireShop2.position.set(55, 1.5, -13);
    scene.add(tireShop2);

    // Árvores e postes duplicados
    createTree(42, -6);
    createTree(58, -6);
    createLamp(44, -2);
    createLamp(54, 2);

    // --- Ponte entre as duas regiões ---
    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(11, 0.1, 4),
      new THREE.MeshStandardMaterial({ color: 0x8B4513 })
    );
    bridge.position.set(25, 0, 0);
    scene.add(bridge);
    
    // --- Banco onde estão o rapaz e a moça ---
const bancoEncontro = new THREE.Mesh(
  new THREE.BoxGeometry(4, 0.5, 1.2),
  new THREE.MeshStandardMaterial({ color: 0x996633 })
);
// Coloque o banco na posição próxima dos personagens
bancoEncontro.position.set(0, 0.25, 0); 
scene.add(bancoEncontro);
    function checkConversation() {
  const distBoy = Math.sqrt((boy.position.x - bancoEncontro.position.x)**2 + (boy.position.z - bancoEncontro.position.z)**2);
  const distGirl = Math.sqrt((girl.position.x - bancoEncontro.position.x)**2 + (girl.position.z - bancoEncontro.position.z)**2);
  if (distBoy < 1 && distGirl < 1) {
    hudText = "🧑🏻 Rapaz: Esse banco é perfeito pra conversar!\n👩🏻 Moça: Sim, vamos ate a prefeitura!\n🏛️ Prefeitura: O coração da cidade está aqui!";
    document.getElementById("hud").innerText = hudText;
  }
}  
    // --- Cliente amarelo com cabeça ---
const clienteFace = loader.load("https://i.imgur.com/bZ4xOsL.png"); // pode usar a mesma imagem do rapaz
const clienteHead = new THREE.Sprite(new THREE.SpriteMaterial({ map: clienteFace }));
clienteHead.scale.set(1, 1, 1);
scene.add(clienteHead);

// Movimento dos clientes (com cabeça no amarelo)
function moveCustomers() {
  cust1.position.z += 0.02;
  if (cust1.position.z > -8) cust1.position.z = -12;

  cust2.position.z += 0.015;
  if (cust2.position.z > -8) cust2.position.z = -12;

  // A cabeça segue o cliente amarelo
  clienteHead.position.set(cust1.position.x, cust1.position.y + 0.5, cust1.position.z);

  // Faz a cabeça girar levemente
  clienteHead.rotation.z += 0.05;
}

    // Loop de animação
    function animate() {
      requestAnimationFrame(animate);

      car1.position.x += 0.02;
      if (car1.position.x > 20) car1.position.x = -10;

      car2.position.x -= 0.015;
      if (car2.position.x < -6) car2.position.x = 6;

      car3.position.x += 0.01;
      if (car3.position.x > 6) car3.position.x = -6;

      moveCustomers();
      checkConversation();

      renderer.render(scene, camera);
    }
    animate();

    // --- Controles do rapaz (WASD) e da moça (setas) ---
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      // Rapaz (WASD)
      if (key === "w") boy.position.z -= 0.2;
      if (key === "s") boy.position.z += 0.2;
      if (key === "a") boy.position.x -= 0.2;
      if (key === "d") boy.position.x += 0.2;

      // Moça (setas)
      if (event.key === "ArrowUp") girl.position.z -= 0.2;
      if (event.key === "ArrowDown") girl.position.z += 0.2;
      if (event.key === "ArrowLeft") girl.position.x -= 0.2;
      if (event.key === "ArrowRight") girl.position.x += 0.2;
    });
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Hipermercado</title>
  <style>
    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #ffcc00;
      font-size: 2.5em;
      margin-top: 30px;
    }
    #hud {
      color: #fff;
      margin: 20px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>Bem-vindo ao Meu Hipermercado!</h1>
  <div id="hud">🎮 WebGloo 
Use WASD para mover o rapaz, setas para mover a moça!</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cena, câmera e renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 10, 10);
    scene.add(light);

    // Funções auxiliares
    function createTree(x, z) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshStandardMaterial({ color: 0x663300 }));
      trunk.position.set(x, 0.5, z);
      scene.add(trunk);
      const crown = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0x228B22 }));
      crown.position.set(x, 1.5, z);
      scene.add(crown);
    }
    function createLamp(x, z) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
      pole.position.set(x, 1.5, z);
      scene.add(pole);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffff00 }));
      bulb.position.set(x, 3, z);
      scene.add(bulb);
    }

    // Rua e prédios
    const street2 = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 20),
      new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    street2.rotation.x = Math.PI / 2;
    street2.position.set(50, 0, 0);
    scene.add(street2);

    const bakery2 = new THREE.Mesh(
      new THREE.BoxGeometry(6, 3, 4),
      new THREE.MeshStandardMaterial({ color: 0xffcc66 })
    );
    bakery2.position.set(45, 1.5, -12);
    scene.add(bakery2);

    const tireShop2 = new THREE.Mesh(
      new THREE.BoxGeometry(6, 3, 4),
      new THREE.MeshStandardMaterial({ color: 0x999999 })
    );
    tireShop2.position.set(55, 1.5, -13);
    scene.add(tireShop2);

    // Árvores e postes
    createTree(42, -6);
    createTree(58, -6);
    createLamp(44, -2);
    createLamp(54, 2);

    // Ponte
    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(11, 0.1, 4),
      new THREE.MeshStandardMaterial({ color: 0x8B4513 })
    );
    bridge.position.set(25, 0, 0);
    scene.add(bridge);

    // Banco
    const bancoEncontro = new THREE.Mesh(
      new THREE.BoxGeometry(4, 0.5, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x996633 })
    );
    bancoEncontro.position.set(0, 0.25, 0);
    scene.add(bancoEncontro);

    // Câmera
    camera.position.set(0, 8, 16);
    camera.lookAt(0, 0, 0);

    // Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
