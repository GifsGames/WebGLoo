<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WebGloo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      white-space: pre-line;
      z-index: 5;
    }
    #intro, #outro {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Black', sans-serif;
      font-size: 2em;
      animation: fadeIn 2s ease-in;
    }
    #intro {
      background: radial-gradient(circle, #000 70%, #222 100%);
      color: #ffcc00;
      z-index: 10;
    }
    #intro button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1em;
      cursor: pointer;
      background: #ffcc00;
      border: none;
      border-radius: 8px;
    }
    #outro {
      background: black;
      color: white;
      display: none;
      z-index: 20;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="intro">
    🎬 WebGloo<br>
    <small>Prepare-se para a aventura!</small><br>
    <button onclick="startGame()">Começar</button>
  </div>

  <div id="hud">🎮 WebGloo 
Use WASD para mover o rapaz, setas para mover a moça!</div>

  <div id="outro">🎬 Fim da Jornada<br>Obrigado por jogar!</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    let gameStarted = false;

    function startGame() {
      document.getElementById("intro").style.display = "none";
      gameStarted = true;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Rua principal
    const street = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 20),
      new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    street.rotation.x = -Math.PI / 2;
    scene.add(street);

    // Ponte
    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.5, 4),
      new THREE.MeshStandardMaterial({ color: 0x8B4513 })
    );
    bridge.position.set(0, 0, 0);
    scene.add(bridge);

    // Prefeitura
    const prefeitura = new THREE.Mesh(
      new THREE.BoxGeometry(8, 4, 5),
      new THREE.MeshStandardMaterial({ color: 0x336699 })
    );
    prefeitura.position.set(-12, 2, 12);
    scene.add(prefeitura);

    // Banco
    const bancoPrefeitura = new THREE.Mesh(
      new THREE.BoxGeometry(4, 0.5, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x996633 })
    );
    bancoPrefeitura.position.set(12, 0.15, -8);
    scene.add(bancoPrefeitura);

    // Cubo amarelo (casa direita)
    const cuboAmarelo = new THREE.Mesh(
      new THREE.BoxGeometry(2, 2, 2),
      new THREE.MeshStandardMaterial({ color: 0xffff00 })
    );
    cuboAmarelo.position.set(12, 1, -12);
    scene.add(cuboAmarelo);

    // Cubo azul (casa esquerda)
    const cuboAzul = new THREE.Mesh(
      new THREE.BoxGeometry(2, 2, 2),
      new THREE.MeshStandardMaterial({ color: 0x0000ff })
    );
    cuboAzul.position.set(-12, 1, -12);
    scene.add(cuboAzul);

    // Loop de animação
    function animate() {
      requestAnimationFrame(animate);
      if (gameStarted) {
        renderer.render(scene, camera);
      }
    }
    animate();

    // Controles
    window.addEventListener("keydown", (event) => {
      if (!gameStarted) return;
      const key = event.key.toLowerCase();

      if (key === "w") camera.position.z -= 0.2;
      if (key === "s") camera.position.z += 0.2;
      if (key === "a") camera.position.x -= 0.2;
      if (key === "d") camera.position.x += 0.2;

      if (event.key === "Escape") {
        document.getElementById("outro").style.display = "flex";
      }
    });
  </script>
</body>
</html>
